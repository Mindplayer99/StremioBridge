name: Build StremioBridge
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['dist/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: stremiobridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository != 'Mindplayer99/TPBBridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :StremioBridge:testDebugUnitTest :StremioBridge:make makePluginsJson
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: StremioBridge
          path: dist/
          if-no-files-found: error
  update-dist:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'Mindplayer99/TPBBridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StremioBridge
          path: dist/
      - name: Commit verified distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/StremioBridge.cs3 dist/plugins.json dist/repo.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update StremioBridge distribution'
            git push origin HEAD:main
          fi
